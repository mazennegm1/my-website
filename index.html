<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love U</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #111, #2b0f16);
            color: white;
            text-align: center;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px
        }

        p {
            font-size: 1.3rem;
            max-width: 700px;
            line-height: 1.8
        }

        .heart {
            font-size: 5rem;
            animation: beat 1s infinite
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #msg {
            display: none;
            margin-top: 25px;
            font-size: 1.5rem
        }

        @keyframes beat {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.15)
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h1>I Love U</h1>
        <p>
            message</p>

        <button onclick="showMsg()">Click Here</button>

        <div id="msg">
            <h2>message 💍</h2>
            <p>message❤️</p>
        </div>
    </div>

    <script>
        function showMsg() {
            document.getElementById('msg').style.display = 'block';
        }
    </script>
</body>

</html>
